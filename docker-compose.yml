version: "3.9"

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: lp_enterprise_api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 4000
      HOST: 0.0.0.0
      JWT_SECRET: ${JWT_SECRET:-lp_production_jwt_secret_min32chars_key_2026_enterprise}
    volumes:
      - ./backend/data:/app/data
    ports:
      - "4000:4000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: lp_enterprise_web
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
