name: Validate application and production safeguards

on:
  pull_request:
  push:
    branches:
      - "**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out the exact commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install the pinned Node runtime
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
      - name: Validate with disposable databases
        run: python3 ops/ci.py
      - name: Install the test browser
        working-directory: frontend
        run: npx --no-install playwright install --with-deps chromium
      - name: Check production user flows on synthetic data
        run: node ops/browser-smoke.mjs
      - name: Package runtime release
        run: |
          mkdir -p dist-release
          python3 ops/package_release.py --commit ${{ github.sha }} --output dist-release/release-${{ github.sha }}.tar.gz
      - name: Upload runtime release artifact
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2b6cb7079576 # v4
        with:
          name: runtime-release-${{ github.sha }}
          path: dist-release/release-${{ github.sha }}.tar.gz
          if-no-files-found: error
          retention-days: 14
