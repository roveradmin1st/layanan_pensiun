name: Validate application and production safeguards

on:
  pull_request:
  push:
    branches:
      - main
      - fix/production-readiness-20261109
      - fix/bsi-product-parameters
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out the exact commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install the pinned Node runtime
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
      - name: Validate with disposable databases
        run: python3 ops/ci.py
      - name: Install the test browser
        working-directory: frontend
        run: npx --no-install playwright install --with-deps chromium
      - name: Check production user flows on synthetic data
        run: node ops/browser-smoke.mjs
